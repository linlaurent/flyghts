name: Update alliance data

on:
  schedule:
    # Monthly at 06:00 UTC on the 1st — alliance membership changes slowly
    - cron: "0 6 1 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  update-alliances:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Fetch alliance membership from OpenTravelData
        run: uv run python scripts/fetch_reference_data.py --alliances-only

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/flyghts/reference/data/alliances.json
          git diff --staged --quiet || git commit -m "data: update alliances $(date -u +%Y-%m-%d)"
          git push
